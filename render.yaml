services:
  - type: web
    name: tradeflow-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npm run build && cd server && npm install --include=dev && npm run build
    startCommand: cd server && node dist/server.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DB_PATH
        value: /data/tradeflow.db
    disk:
      name: tradeflow-data-v3
      mountPath: /data
      sizeGB: 1
